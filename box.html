<html>
<head>
    <title>CSS Flexbox Example</title>
    <style>
        .container {
            display: flex;
            background-color: lightgray;
            padding: 10px;
            gap: 10px;
        }

        .box {
            background-color: steelblue;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
</body>
</html>
